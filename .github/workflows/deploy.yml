name: Deploy para GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Permissoes necessarias para publicar no GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Nao cancela um deploy em andamento
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Build (base = nome do repositorio)
        # Se o seu repositorio for "usuario.github.io", troque para: npm run build:custom -- /
        run: npm run build:custom -- /${{ github.event.repository.name }}/

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Enviar artefato
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
